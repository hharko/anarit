<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@600;700;800&amp;display=swap">
<style>
/* Layout: team sheets laid on ice in one working column; the arena scoreboard is the single loud element and stays pinned above the buttons. */
:root{
  --ice:#eef3f7; --sheet:#ffffff; --ink:#0d1a2b; --ink-2:#4a5b6e; --line:#d3dde6; --press:#dfe8f0;
  --red:#c8102e; --on-red:#ffffff; --blue:#1d4f9f; --on-blue:#ffffff; --focus:#1d4f9f;
  --ok:#1a7d44; --warn:#94600f;
  --board:#0d1a2b; --board-ink:#f4f8fb; --board-dim:#a3b5c8; --board-line:#27394f; --board-accent:#ff7184; --board-warn:#f5b83d; --on-board-warn:#201503;
  --f-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ice:#0a1119; --sheet:#121c28; --ink:#e9eff5; --ink-2:#94a6b9; --line:#243345; --press:#1c2a3b;
    --red:#ff5468; --on-red:#1a0508; --blue:#74a8f5; --on-blue:#06162e; --focus:#74a8f5;
    --ok:#4cc37f; --warn:#e3b341;
    --board:#05090e; --board-ink:#f4f8fb; --board-dim:#8ea2b7; --board-line:#1d2c3e; --board-accent:#ff7184;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ice:#0a1119; --sheet:#121c28; --ink:#e9eff5; --ink-2:#94a6b9; --line:#243345; --press:#1c2a3b;
  --red:#ff5468; --on-red:#1a0508; --blue:#74a8f5; --on-blue:#06162e; --focus:#74a8f5;
  --ok:#4cc37f; --warn:#e3b341;
  --board:#05090e; --board-ink:#f4f8fb; --board-dim:#8ea2b7; --board-line:#1d2c3e; --board-accent:#ff7184;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ice);color:var(--ink);font:400 16px/1.4 var(--f-body);padding-inline:16px;padding-bottom:24px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Top bar: the name and who is signed in share one row, and the views sit under it on one row that scrolls sideways when they do not fit. */
.top{display:flex;flex-direction:column;gap:10px;padding-top:4px;margin-bottom:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand h1{font:800 clamp(24px,7.4vw,30px)/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.mark{flex:none;width:30px;height:30px;margin:-2px -2px 0 -3px}
.mark .stk{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round}
.mark .pk{fill:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);color:var(--ink-2);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="wait"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--red)}
.tabs{border-bottom:3px solid var(--red)}
.tabsx{position:relative;display:flex;gap:2px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabsx::-webkit-scrollbar{display:none}
.tabs.fr .tabsx{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.tabs.fl .tabsx{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent)}
.tabs.fl.fr .tabsx{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.tab{flex:1 0 auto;white-space:nowrap;text-align:center;border:0;background:none;color:var(--ink-2);font:700 15px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;padding:10px 11px 9px;border-radius:6px 6px 0 0;min-height:44px;touch-action:manipulation}

.tab.tt{white-space:normal;max-width:10em;padding-block:5px}
.ttx{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;line-height:1.12}
@media (min-width:900px){.tab.tt{max-width:13em}}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--red);color:var(--on-red)}

/* Controls */
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 14px;font:600 15px/1.2 var(--f-body);min-height:42px;touch-action:manipulation}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}

/* Standings tables */

@media (max-width:420px){.tbl th,.tbl td{padding-inline:5px}}
.tbl .cardb{min-height:40px;display:flex;align-items:center}
.tbl thead th{font:700 13px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--ink)}
.tbl .l{text-align:left}

.tbl tbody th{font-weight:600}
.tbl td.p{font:800 21px/1 var(--f-display)}
.tbl td.p span{display:inline-block}
.tbl abbr{text-decoration:none}
.tn{display:flex;align-items:center;gap:8px;min-width:0}
.tn > span{min-width:0;overflow-wrap:anywhere}
.tn small{display:block;font-weight:400;font-size:13px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:14px}
.legend b{color:var(--ink)}
.muted{color:var(--ink-2)}

/* Settings */
.set{display:flex;flex-direction:column;gap:12px;min-width:0}
.set > .sec{padding-bottom:8px;border-bottom:2px solid var(--ink)}
.hint{color:var(--ink-2);font-size:14px;max-width:65ch}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > span,.f > label{font:600 13px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
input,select{width:100%;min-width:0;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);font:500 16px/1.2 var(--f-body)}
.rows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"name short" "val target" "del del";gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:first-child{padding-top:0}
.a-name{grid-area:name}.a-short{grid-area:short}.a-val{grid-area:val}.a-target{grid-area:target}.a-del{grid-area:del}
.stepper{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:4px}
.stepper .btn{padding:0;font-size:20px}
.stepper input{text-align:center;font-variant-numeric:tabular-nums}
@media (min-width:760px){
  .srow{grid-template-columns:minmax(0,1.5fr) 96px 170px 170px auto;grid-template-areas:"name short val target del"}
}
.av{position:relative;overflow:hidden;flex:none;width:38px;height:38px;border-radius:50%;background:var(--tc);color:var(--on);display:inline-grid;place-items:center;font:800 15px/1 var(--f-display);letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .14)}
.av.lg{width:64px;height:64px;font-size:26px}

.listhead{display:flex}
.slist{list-style:none;margin:0;padding:0;max-width:640px;max-height:min(620px,max(280px,calc(100vh - 310px)));overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border:1px solid var(--line);border-radius:10px}

.item{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 12px;border:0;background:none;color:var(--ink);text-align:left;touch-action:manipulation}

.item:active{background:var(--press)}

.itxt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.itxt b{font-weight:600}

.ipts{flex:none;font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ipts span{display:inline-block}

.back::before{content:"‹";margin-right:8px;font-weight:700}
.seg.wide{display:flex}

.pbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

[data-k="mh"] li.hp .itxt b,[data-k="mh"] li.hr .itxt b{color:var(--warn)}

.kpi b .of,.omsum .of{font-size:.6em;color:var(--ink-2)}
.omsum .bad b,.omsum .bad{color:var(--red)}
.vmsite .sync{white-space:normal;line-height:1.3}
.vmsite dt{width:7.5em}
.me2{font-weight:500;color:var(--ink-2)}
@media (min-width:1000px){.vm{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr)}.vmside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain}}
.mpgrid{display:flex;flex-direction:column;gap:14px;min-width:0}
.cols2{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols2 > div{display:flex;flex-direction:column;gap:12px;min-width:0}
.wrap{max-width:1240px;margin-inline:auto}
html.showing .wrap{max-width:none}
@media (min-width:1000px){
  .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}

}
.mpmain,.mpside{display:flex;flex-direction:column;gap:14px;min-width:0}
.gbar{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ice);border-top:1px solid var(--line);box-shadow:0 -8px 18px rgb(13 26 43 / .10);display:flex;flex-direction:column;gap:6px}

.mctl .savebar{flex:1 1 100%;order:3;margin-top:0}
.btn.twice.armed{background:var(--ink);border-color:var(--ink);color:var(--ice)}
.mctl .tw{flex:1 1 auto}
.xbtn{flex:none;width:42px;padding:0;background:var(--press);color:var(--ink-2)}
.lrow{display:flex;align-items:center}

.chip.on{background:var(--red);border-color:var(--red);color:var(--on-red)}

.clk{font-variant-numeric:tabular-nums}

.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead b{font:700 16px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:10px;min-width:0;min-height:38px}
.mname{flex:1 1 0;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mname.tbd{font-weight:400;color:var(--ink-2)}

  const h = (location.hash || '').replace('#', '');
  if (enterShow(h)) { render(); return; }
  if (TABS.includes(h) && h !== ui.tab) { ui.tab = h; ui.confirm = null; render(); }
});
// With no shared store the page lives in this browser only; another tab of it (the big-screen show) follows along through storage events.
window.addEventListener('storage', e => {
  if (ui.backend !== 'local' || (e.key !== LS_STATE && e.key !== LS_PHOTOS && e.key !== LS_LOG)) return;
  readLocal();
  render();
});
document.addEventListener('keydown', e => {
  if (!ui.show || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { showStep(e.key === 'ArrowRight' ? 1 : -1); render(); }
  else if (e.key === ' ' && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); ui.showPaused = !ui.showPaused; render(); }
});
window.addEventListener('resize', () => { if (ui.show) render(); else tabFade(); });
app.addEventListener('scroll', e => { if (e.target && e.target.classList && e.target.classList.contains('tabsx')) tabFade(); }, true);
document.addEventListener('visibilitychange', () => { if (ui.show && document.visibilityState === 'visible') keepAwake(); if (document.visibilityState === 'hidden') leave(); else beat(true); });
window.addEventListener('pagehide', () => leave());

// Running clocks tick on their own once a second; a countdown reaching zero repaints so the break controls come back.
let vmTick = 0, vmTick2 = 0;
setInterval(() => {
  if (ui.show) {
    const T = showTour();
    if (T && !ui.showPaused) {
      const sl = showSlides(T), cur = sl[(ui.showIdx || 0) % sl.length];
      ui.showT = (ui.showT || 0) + 1;
      if (ui.showT >= cur.dur) { ui.showIdx = ((ui.showIdx || 0) + 1) % sl.length; ui.showT = 0; }
    }
    render();   // repaints clocks, progress and any new results
    return;
  }
  // Valvomo looks again every half minute, so a match turning late or an interruption growing long shows up by itself
  if (app.querySelector('.vmwrap') && (vmTick = (vmTick + 1) % 30) === 0) { render(); return; }
  if (!ui.show && (vmTick2 = (vmTick2 + 1) % 30) === 0) beat();
  const els = app.querySelectorAll('[data-clk]');
  if (!els.length) return;
  const now = nowMs(); let over = false;
  for (let i = 0; i < els.length; i++) {
    const ts = +els[i].getAttribute('data-ts'), down = els[i].getAttribute('data-clk') === 'down';
    if (down && ts <= now) over = true;
    const txt = clock(down ? ts - now : now - ts);
    if (els[i].textContent !== txt) els[i].textContent = txt;
  }
  if (over) render();
}, 1000);

boot();
})();
</script>
