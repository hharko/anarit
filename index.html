/* A tournament's sections: a row of tabs under the scoreboards, underlined like a ruler. A section with nothing yet says so in a quiet box. */

    case 'm-time': { const T = state.tournaments[d.tour], m = T && T.matches[d.id]; if (m) { m.time = /^\d{2}:\d{2}$/.test(el.value) ? el.value : ''; persistMatch(d.tour, d.id, ['time']); logAct(d.tour, d.id, 'm', m.time ? 'asetti alkamisajaksi klo ' + m.time : 'poisti alkamisajan'); } break; }
    case 'add-sub': addSub(d.tour, d.id, d.side, el.value); break;
    case 'photo': pickPhoto(d.key, el.files && el.files[0]); try { el.value = ''; } catch (e) { /* some browsers lock the field */ } return;
    case 'tour-team-add': { const T = state.tournaments[d.id]; if (T && state.teams[el.value] && tourTeamIds(T).indexOf(el.value) < 0) { const before = tourSnap(T); T.teams = (T.teams || []).concat([el.value]); persistTour(d.id, before); } break; }
    case 'tour-player-add': {
      const T = state.tournaments[d.id], pid = el.value, q = state.players[pid];
      if (!T || !q || kindOf(q) !== 'pelaaja') break;
      const before = tourSnap(T);
      T.out = (T.out || []).filter(x => x !== pid);   // a team's player taken out comes back; anyone else is added on his own
      if (tourPlayerIds(T).indexOf(pid) < 0) T.extra = (T.extra || []).concat([pid]);
      persistTour(d.id, before); break;
    }
    case 'tour-roster-add': {
      // a player into one of the tournament's teams for this tournament alone; his own team stays as it is
      const T = state.tournaments[d.id], pid = el.value, q = state.players[pid], tid = d.team;
      if (!T || !q || kindOf(q) !== 'pelaaja' || !state.teams[tid]) break;
      const before = tourSnap(T), r = Object.assign({}, T.roster || {});
      if (q.teamId === tid) delete r[pid]; else r[pid] = tid;
      T.roster = r;
      T.out = (T.out || []).filter(x => x !== pid);
      T.extra = (T.extra || []).filter(x => x !== pid);
      persistTour(d.id, before); break;
    }
    case 'assign-player': { const p = state.players[el.value]; if (p && kindOf(p) === 'pelaaja' && state.teams[d.id]) { setTeam(p, d.id); persist('players/' + el.value); } break; }
    case 'team-name': { const t = state.teams[d.id]; if (t && v) { t.name = v; persist('teams/' + d.id); } break; }
    case 'player-badge': { const p = state.players[d.id]; if (p && kindOf(p) === 'pelaaja') { const b = v.slice(0, 20); if (!b || b === 'Pelaaja') delete p.badge; else p.badge = b; persist('players/' + d.id); } break; }
    case 'player-name': {
      const p = state.players[d.id], name = v.slice(0, 24), taken = p && name ? nameTaken(name, d.id) : '';
      if (!p || !name) break;
      if (taken) { ui.nameErr = { id: d.id, text: taken }; break; }
      ui.nameErr = null; p.name = name; persist('players/' + d.id);
      break;
    }
    case 'player-team': { const p = state.players[d.id]; if (p && kindOf(p) === 'pelaaja' && (el.value === '' || state.teams[el.value])) { setTeam(p, el.value); persist('players/' + d.id); } break; }
    case 'stat-name': { const s = stat(); if (s && v) { if (s.short === autoShort(s.name)) s.short = autoShort(v); s.name = v; persistConf(['stats']); } break; }
    case 'stat-short': { const s = stat(); if (s) { s.short = (v || autoShort(s.name)).slice(0, 3); persistConf(['stats']); } break; }
    case 'stat-value': { const s = stat(); const n = parseFloat(v.replace(/−/g, '-').replace(',', '.')); if (s && Number.isFinite(n)) { s.value = round2(n); persistConf(['stats']); } break; }
    case 'stat-target': { const s = stat(); if (s && ['player', 'team', 'both'].includes(el.value)) { s.target = el.value; persistConf(['stats']); } break; }
  }
  render();
}

  const S = tourStats(T), tr = tourTeamRows(T, S), pr = tourPlayerRows(T, S), pst = state.config.stats.filter(x => appl(x, 'p')), ties = tr.some(r => r.s.t > 0);
  if (!tr.length) return '';
  const ab = (short, title) => `<th scope="col"><abbr title="${title}">${short}</abbr></th>`;
  // the scoring table shows the top ten places until it is opened in full, so the page under it stays near
  const cut = !ui.tbAll && pr.filter(r => r.rank > 10).length > 0, shown = cut ? pr.filter(r => r.rank <= 10) : pr;
  return `<div class="cols2" data-k="tb-cols"><div data-k="tb-c1"><h3 class="sub" data-k="tb-h1">Sarjataulukko</h3><div class="tscroll" data-k="tb-teams"><table class="tbl"><thead><tr><th class="l rk" scope="col">#</th><th class="l" scope="col">Joukkue</th>${ab('O', 'Pelatut ottelut')}${ab('V', 'Voitot')}${ties ? ab('T', 'Tasapelit') : ''}${ab('H', 'Häviöt')}${ab('M', 'Tehdyt ja päästetyt maalit')}${ab('P', 'Pisteet')}</tr></thead><tbody>` +
    tr.map(r => `<tr data-k="tbt-${esc(r.t.id)}" class="crow" ${cardAttrs('t', r.t.id, 'tbt-' + r.t.id)}><td class="l rk">${r.rank}.</td><th class="l" scope="row">${cardName('t', r.t, 'tbt-' + r.t.id)}</th><td>${r.s.o}</td><td>${r.s.v}</td>${ties ? `<td>${r.s.t}</td>` : ''}<td>${r.s.h}</td><td>${r.s.gf}–${r.s.ga}</td><td class="p"><span data-bump>${fmt(r.pts)}</span></td></tr>`).join('') + `</tbody></table></div>` +
    `</div><div data-k="tb-c2"><h3 class="sub" data-k="tb-h2">Pistepörssi</h3>` + (pr.length ? `<div class="tscroll" data-k="tb-players"><table class="tbl"><thead><tr><th class="l rk" scope="col">#</th><th class="l" scope="col">Pelaaja</th>${pst.map(x => ab(esc(x.short), esc(x.name))).join('')}${ab('P', 'Pisteet')}</tr></thead><tbody>` +
      shown.map(r => `<tr data-k="tbp-${esc(r.q.id)}" class="crow" ${cardAttrs('p', r.q.id, 'tbp-' + r.q.id)}><td class="l rk">${r.rank}.</td><th class="l" scope="row">${cardName('p', r.q, 'tbp-' + r.q.id, esc(tTeamText(T, r.q)))}</th>${pst.map(x => `<td>${r.c[x.id] || 0}</td>`).join('')}<td class="p"><span data-bump>${fmt(r.pts)}</span></td></tr>`).join('') + `</tbody></table></div>` +
      (cut || ui.tbAll && pr.some(r => r.rank > 10) ? `<div data-k="tb-all"><button class="btn sm" id="tb-all" data-act="tb-all" aria-expanded="${!cut}">${cut ? 'Näytä kaikki ' + pr.length : 'Näytä vain kärki'}</button></div>` : '')
      : `<p class="hint" data-k="tb-nop">Turnauksen joukkueissa ei ole vielä pelaajia.</p>`) + `</div></div>` +
    `<p class="legend" data-k="tb-key">${pst.map(x => `<span><b>${esc(x.short)}</b> ${esc(x.name)} ${signed(x.value)} p</span>`).join('')}${linkStat('win') ? `<span>Voitosta joukkue saa ${signed(linkStat('win').value)} p</span>` : ''}</p>`;
}
// Kokonaistilanne, opened from Etusivu: the overall standings and scoring table, every match of every tournament added up.

function backBtn(scope, label) { return `<div data-k="back-${scope}"><button class="btn back" id="back-${scope}" data-act="open" data-scope="${scope}" data-id="">${label}</button></div>`; }
function subtabs(scope, tabs, cur) {

}
// One button pressed twice: the first press arms it, the second does the thing. While armed, a grey X beside it takes the press back.
// The X sits on the side away from where the button is anchored, so the button itself never moves under the finger.
// Fields that keep what is typed until it is saved with their own button: a time, a name, a choice from a list.
// While a field differs from what is stored, Tallenna and Peru show up under it; Enter saves too.
const SAVE_FIELDS = ['m-time', 'tour-name', 'tour-start', 'tour-break', 'team-name', 'player-name', 'player-badge', 'player-team', 'title', 'stat-name', 'stat-short', 'stat-value', 'stat-target', 'link-goal', 'link-assist', 'link-win', 'role-name', 'acct-role'];
const isSaveField = el => !!(el && el.dataset && SAVE_FIELDS.indexOf(el.dataset.field) >= 0);
function fieldDiffers(el) {
  if (el.tagName === 'SELECT') { const o = Array.from(el.options).find(x => x.hasAttribute('selected')) || el.options[0]; return !!o && el.value !== o.value; }
  return el.value !== (el.getAttribute('value') || '');
}
function markPend(el) {
  const was = !!ui.pend[el.id], now = fieldDiffers(el);
  if (now) ui.pend[el.id] = true; else delete ui.pend[el.id];
  if (was !== now) render();
}
// The buttons for one field, or for a group of fields saved together.
function saveBar(ids, label) {
  ids = [].concat(ids);
  if (!ids.some(id => ui.pend[id])) return '';
  const k = esc(ids[0]), list = esc(ids.join(','));
  return `<div class="rowbtns savebar" data-k="sb-${k}"><button type="button" class="btn primary sm" id="sb-${k}" data-act="save-field" data-for="${list}">${label || 'Tallenna'}</button><button type="button" class="btn sm" id="sc-${k}" data-act="cancel-field" data-for="${list}">Peru</button></div>`;
}
function saveFields(list) {
  const ids = String(list || '').split(',').filter(Boolean);
  ids.forEach(id => { const el = document.getElementById(id); if (el && isSaveField(el) && fieldDiffers(el)) field(el.dataset.field, el.dataset, el); });
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.tagName !== 'SELECT' && el.value.trim() === (el.getAttribute('value') || '')) el.value = el.getAttribute('value') || '';   // saved without the spaces around it
    if (!el || !fieldDiffers(el)) delete ui.pend[id];
  });
  render();
}
function cancelFields(list) {
  String(list || '').split(',').forEach(id => {
    const el = document.getElementById(id);
    if (el) { if (el.tagName === 'SELECT') { const o = Array.from(el.options).find(x => x.hasAttribute('selected')) || el.options[0]; if (o) el.value = o.value; } else el.value = el.getAttribute('value') || ''; }
    delete ui.pend[id];
  });
}
// `tone` 'primary' or 'plain' makes a two-press button for something that is not a removal; it turns dark while armed.
function twice(id, key, label, left, armedLabel, tone, off) {
  const armed = ui.confirm === key;
  const x = armed ? `<button type="button" class="btn xbtn" id="${esc(id)}-x" data-act="no" aria-label="Peru painallus" title="Peru">✕</button>` : '';
  const cls = tone ? (tone === 'primary' ? 'btn primary twice' : 'btn twice') + (armed ? ' armed' : '') : 'btn danger twice' + (armed ? ' solid' : '');
  return `<span class="tw${left ? ' left' : ''}" data-k="tw-${esc(id)}">${left ? x : ''}<button type="button" class="${cls}" id="${esc(id)}" data-act="${armed ? 'yes' : 'arm'}" data-key="${esc(key)}"${off ? ' disabled' : ''}>${armed ? esc(armedLabel || 'Paina uudelleen') : esc(label)}</button>${left ? '' : x}</span>`;
}
// The same two presses with a small picture on the button: for rows where a worded button would not fit beside the text.
const ICON = { edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>', del: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>' };
function twiceIcon(id, key, icon, label) {

  return `<span class="tw left" data-k="tw-${esc(id)}">${x}<button type="button" class="btn danger twice ibtn${armed ? ' solid' : ''}" id="${esc(id)}" data-act="${armed ? 'yes' : 'arm'}" data-key="${esc(key)}" aria-label="${esc(armed ? 'Vahvista: ' + lcFirst(label) : label)}" title="${esc(label)}">${armed ? 'Vahvista' : icon}</button></span>`;
}

function playerList() {
  const all = allPlayers().sort((a, b) => a.name.localeCompare(b.name, 'fi') || byOrder(a, b)), rk = ranks('p'), adm = can('admin');

  else if (f.dataset.form === 'add-tour') addTour(f);
  else if (f.dataset.form === 'add-match') addMatch(f);
});
app.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key !== 'Enter' || !el.matches || !el.matches('input[data-field]')) return;
  if (isSaveField(el)) { e.preventDefault(); if (fieldDiffers(el)) saveFields(el.id); return; }
  el.blur();
});
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').replace('#', '');
  if (enterShow(h)) { render(); return; }
  if (h === 'tulostaulu' && !(ui.tab === 'etusivu' && ui.homeBoard)) { ui.tab = 'etusivu'; ui.homeBoard = true; ui.confirm = null; render(); return; }
  if (TABS.includes(h) && (h !== ui.tab || (h === 'etusivu' && ui.homeBoard))) { ui.tab = h; ui.homeBoard = false; ui.confirm = null; render(); }
});
// With no shared store the page lives in this browser only; another tab of it (the big-screen show) follows along through storage events.
window.addEventListener('storage', e => {
  if (ui.backend !== 'local' || (e.key !== LS_STATE && e.key !== LS_PHOTOS && e.key !== LS_LOG)) return;
  readLocal();
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.wiz) { ui.wiz = null; ui.focusId = 'wz-open'; render(); return; }
  if (e.key === 'Escape' && ui.qa) { const t = ui.qa.tid; ui.qa = null; ui.focusId = 'to-' + t; render(); return; }
  if (e.key === 'Escape' && ui.tm) { const t = ui.tm.pid; ui.tm = null; ui.focusId = 'tc-' + t; render(); return; }
  if (e.key === 'Escape' && ui.bEdit) { const t = ui.bEdit; ui.bEdit = null; ui.focusId = 'pb-' + t; render(); return; }
  if (!showOn() || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { showStep(e.key === 'ArrowRight' ? 1 : -1); render(); }
  else if (e.key === ' ' && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); ui.showPaused = !ui.showPaused; render(); }
});
window.addEventListener('resize', () => { if (showOn()) render(); else tabFade(); });
app.addEventListener('scroll', e => { if (e.target && e.target.classList && e.target.classList.contains('tabsx')) tabFade(); }, true);
document.addEventListener('visibilitychange', () => { if (showOn() && document.visibilityState === 'visible') keepAwake(); });

// Running clocks tick on their own once a second; a countdown reaching zero repaints so the break controls come back.
let vmTick = 0;
setInterval(() => {
  if (showOn()) {
    const T = showTour();
    if (T && !ui.showPaused) {
      const sl = showSlides(T), cur = sl[(ui.showIdx || 0) % sl.length];
      ui.showT = (ui.showT || 0) + 1;
      if (ui.showT >= cur.dur) { ui.showIdx = ((ui.showIdx || 0) + 1) % sl.length; ui.showT = 0; }
    }
    render();   // repaints clocks, progress and any new results
    return;
  }
  // Valvomo looks again every half minute, so a match turning late or an interruption growing long shows up by itself
  if (app.querySelector('.vmwrap') && (vmTick = (vmTick + 1) % 30) === 0) { render(); return; }
  const els = app.querySelectorAll('[data-clk]');
  if (!els.length) return;
  const now = nowMs(); let over = false;
  for (let i = 0; i < els.length; i++) {
    const ts = +els[i].getAttribute('data-ts'), kind = els[i].getAttribute('data-clk'), down = kind === 'down' || kind === 'cd';
    if (down && ts <= now) over = true;
    const txt = kind === 'cd' ? cdText(ts - now, els[i].getAttribute('data-part')) : clock(down ? ts - now : now - ts);
    if (els[i].textContent !== txt) els[i].textContent = txt;
  }
  if (over) render();
}, 1000);

boot();
})();
</script>
